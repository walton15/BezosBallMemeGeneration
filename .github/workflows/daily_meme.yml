name: Daily Meme Generator

on:
  schedule:
    # 9:00pm EDT (UTC-4) Mon-Fri = 1:00am UTC Tue-Sat
    # In winter (EST, UTC-5) this will run at 8:00pm — update to "0 2 * * 2-6" then
    - cron: '0 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai pillow

      - name: Generate meme
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_meme.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meme.jpg send_today.json
          git diff --staged --quiet || git commit -m "Daily meme $(date -u +%Y-%m-%d)"
          git push

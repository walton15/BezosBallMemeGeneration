name: Daily Meme Generator

on:
  schedule:
    # 5:30pm EDT (UTC-4) Mon-Fri = 9:30pm UTC. Runs before the Email Meme window
    # (6:15pm–9:00pm) so today's meme is ready to send.
    # In winter (EST, UTC-5) this will run at 4:30pm — update to "30 22 * * 1-5" then
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai pillow tzdata

      - name: Generate meme
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_meme.py

      - name: Schedule tonight's email
        run: python schedule_email.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meme.jpg send_today.json next_send.json
          git diff --staged --quiet || git commit -m "Daily meme $(date -u +%Y-%m-%d)"
          git push

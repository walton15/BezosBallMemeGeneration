name: Email Meme

on:
  schedule:
    # Lightweight check every 15 min across the possible send window. The random
    # target time (6:15pm–9:00pm ET) is chosen daily by daily_meme.yml and stored
    # in next_send.json; email_gate.py decides when the target has passed.
    # These UTC hours cover the window in both EDT (22:15–01:00) and EST (23:15–02:00).
    - cron: '*/15 22,23 * * *'
    - cron: '*/15 0,1,2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install tzdata

      - name: Decide whether to send now
        id: gate
        run: echo "send=$(python email_gate.py)" >> "$GITHUB_OUTPUT"

      - name: Send meme email
        id: send
        if: steps.gate.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Bezos Ball Meme Bot <${{ secrets.MAIL_USERNAME }}>
          to: evanlazaro@gmail.com
          subject: "GET OUT OF THE BALLS EVAN — daily meme"
          body: "Today's meme is attached."
          attachments: meme.jpg

      - name: Mark as sent
        if: steps.send.outcome == 'success'
        run: |
          python -c "import json; d=json.load(open('next_send.json')); d['sent']=True; json.dump(d, open('next_send.json','w'))"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add next_send.json
          git commit -m "Mark meme sent $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash origin main || true
          git push

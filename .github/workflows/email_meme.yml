name: Email Meme

on:
  schedule:
    # Fire at 6:15pm EDT (UTC-4) Mon-Fri = 10:15pm UTC. This is the EARLIEST
    # send time; the job then sleeps a random 0–165 min so the actual send lands
    # somewhere between 6:15pm and 9:00pm EDT (i.e. 15 min to 3 hours after 6pm).
    # In winter (EST, UTC-5) update the hour to 23 -> "15 23 * * 1-5".
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay (0–165 min)
        run: |
          # Random offset so the send time is uniformly spread across the
          # 6:15pm–9:00pm window (165 min = 9900 s) instead of a fixed time.
          delay=$(( RANDOM % 9901 ))
          echo "Sleeping ${delay}s (~$(( delay / 60 )) min) before sending"
          sleep "$delay"

      - uses: actions/checkout@v4

      - name: Check send status
        id: status
        run: |
          # send_today.json is written by the Daily Meme Generator workflow.
          # Only email when today's meme is flagged for sending.
          send=$(python -c "import json; print(json.load(open('send_today.json')).get('send', False))")
          echo "send=$send" >> "$GITHUB_OUTPUT"
          echo "Send today: $send"

      - name: Send meme email
        if: steps.status.outputs.send == 'True'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Bezos Ball Meme Bot <${{ secrets.MAIL_USERNAME }}>
          to: evanlazaro@gmail.com
          subject: "GET OUT OF THE BALLS EVAN — daily meme"
          body: "Today's meme is attached."
          attachments: meme.jpg

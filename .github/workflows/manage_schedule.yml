name: Manage Schedule

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'enable or disable sending'
        required: true
        type: choice
        options:
          - enable
          - disable
      start_date:
        description: 'Start date YYYY-MM-DD (disable only)'
        required: false
      end_date:
        description: 'End date YYYY-MM-DD (disable only)'
        required: false

permissions:
  contents: write

jobs:
  update-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update config
        run: |
          python update_config.py "${{ inputs.action }}" "${{ inputs.start_date }}" "${{ inputs.end_date }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --staged --quiet || git commit -m "Schedule update: ${{ inputs.action }} ${{ inputs.start_date }} ${{ inputs.end_date }}"
          git push
